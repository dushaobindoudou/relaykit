# ⚠️ 暂不可用：上游对 Cloudflare Workers 的出口 IP 返回 456（JS 挑战型 WAF），
#    公开接口与 /shared/* 对接接口一视同仁。解决访问问题后把本文件
#    改名为 relaykit.config.yaml 即可启用。
#    见 docs/upstream-access.md

# 生产配置。此文件在 .gitignore 里，不进仓库。

store:
  name: "AI Access"
  currency: USDT
  locale: en
  baseUrl: "https://relaykit.mergedao.workers.dev"

suppliers:
  # 公开目录模式：不需要凭据即可镜像上游的分类与商品。
  # ⚠️ 但**下不了单** —— 自动进货需要向上游申请 app_id / app_key
  #    并把 driver 改为 acgfaka。在那之前 fulfillment.mode 必须是 manual。
  - id: upstream
    driver: acgfaka-public
    domain: "http://zhanghao66.com"
    currency: CNY
    # 我们还不是代理，真实成本就是上游零售价。
    # 买了代理之后再改成 agent，否则会按拿不到的低价算毛利。
    costBasis: retail
    timeoutMs: 25000

pricing:
  fx:
    source: static
    rates:
      # 1 CNY = 0.149112 USDT（取自 Coinbase）
      CNY_USDT: "0.149112"
    updatedAt: "2026-09-11T08:06:26Z"

  markup:
    type: fixed
    amount: "1"

  # 按零售价进货时毛利就是那 1 USDT，占比随客单价下降。
  # 设 3% 是为了把高客单商品（加 1u 摊薄到 1~2%）自动挡在外面。
  minMarginPercent: 3
  maxStalenessHours: 24

  rounding:
    mode: up
    increment: "0.01"

  overrides: []

payments:
  windowMinutes: 30
  chains:
    - id: polygon
      enabled: true
      address: "${POLYGON_ADDRESS}"
      confirmations: 30
  amountTagging:
    enabled: true
    decimals: 6

fulfillment:
  # ⚠️ 公开目录模式无法自动进货，必须人工发货。
  # 拿到 app_id / app_key 并把 driver 换成 acgfaka 后才能改回 auto。
  mode: manual
  balanceAlertThreshold: "0"
  haltSalesOnLowBalance: false

alerts: {}
