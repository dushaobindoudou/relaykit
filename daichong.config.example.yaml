# ─────────────────────────────────────────────────────────────────────────────
# RelayKit 配置示例
#
# 复制为 relaykit.config.yaml 后按需修改。
# 密钥请用 ${ENV_VAR} 引用，不要直接写在这里 —— 本文件是可以提交进仓库的。
# ─────────────────────────────────────────────────────────────────────────────

store:
  name: "My Digital Store"
  # 面向客户展示与结算的币种
  currency: USDT
  locale: en            # en | zh-CN
  baseUrl: "https://shop.example.com"
  supportEmail: "support@example.com"

suppliers:
  # driver: mock —— 内置演示上游，不需要任何凭据，开箱即可跑通全流程。
  # 先用它把店跑起来，确认没问题后再换成下面注释掉的真实上游配置。
  - id: demo
    driver: mock
    currency: CNY

  # driver: acgfaka —— 对接任何运行 acg-faka（异次元发卡）的上游站点。
  # 需要向上游站长申请 app_id / app_key 并请其为商品开启「开放对接」。
  # - id: primary
  #   driver: acgfaka
  #   domain: "https://upstream.example.com"
  #   appId: "${SUPPLIER_APP_ID}"
  #   appKey: "${SUPPLIER_APP_KEY}"
  #   currency: CNY
  #   timeoutMs: 20000

  # driver: acgfaka-public + autoPurchase —— 自动中转采购（二道贩子模式）。
  # 不需要上游任何凭据：我们以上游普通客户的身份游客下单，用热钱包按
  # 官方 USDT 通道自动付款，收卡后自动交付，差价留在我们钱包里。
  # 前置条件见 docs/auto-purchase.md（中继 + 热钱包 + 资金护栏）。
  # - id: upstream
  #   driver: acgfaka-public
  #   domain: "https://upstream.example.com"
  #   currency: CNY
  #   costBasis: retail
  #   # Worker 出口被上游 WAF 拦时才需要；本地/自有服务器直连则删掉这行。
  #   relayUrl: "https://your-relay.example.com"
  #   autoPurchase:
  #     enabled: true
  #     # 游客下单的联系身份，必须是我们可控的邮箱（查单凭据之一）。
  #     contact: "relay@your-shop.example.com"
  #     # 上游支付通道 id。6/5 = EVM USDT（polygon/BSC，可自动付款）；
  #     # 4 = TRC20 无法自动签名，选了也只会转人工。
  #     payChannelId: 6
  #     # 单笔自动付款上限（USDT），超出转人工 —— 资金护栏。
  #     maxPayUsdt: "30"
  #     # 上游 USDT 通道最低金额门槛，低于自动凑单（余量进本地库存）。
  #     minBatchCny: "25"

pricing:
  fx:
    # static：手工维护汇率。简单，但**它不会自己更新**，
    # 配合下面的 maxStalenessHours 使用，过期即停售而不是按老汇率继续卖。
    source: static
    rates:
      # 含义：1 CNY = 0.1389 USDT
      CNY_USDT: "0.1389"
    updatedAt: "2026-09-11T00:00:00Z"

  # 默认加价。fixed 以 store.currency 计 —— "1" 就是每单赚 1 USDT。
  markup:
    type: fixed         # fixed | percent；中转毛利率用 percent，如 amount: "20" 即加价 20%
    amount: "1"

  # 最低毛利护栏（毛利率 = (售价-成本)/售价）。
  # 低于此值的商品自动下架，防止上游涨价或汇率跳动时低于成本成交。
  # 注意：固定加价的毛利率随客单价上升而下降，高客单商品容易被这条拦下 ——
  # 那通常正是你想要的结果。
  minMarginPercent: 5

  # 汇率超过这个时长未更新就视为不可信，停止上架。
  maxStalenessHours: 24
  maxDriftPercent: 10

  rounding:
    mode: up            # up = 向上取整保毛利；nearest = 四舍五入
    increment: "0.01"

  # 针对单个商品覆盖默认加价。带 race 的规则优先于只匹配 code 的规则。
  overrides: []
  # - supplier: primary
  #   code: "ABC123"
  #   race: "1年"
  #   markup: { type: percent, amount: "20" }

payments:
  # 付款窗口，超时未支付自动关单
  windowMinutes: 30

  chains:
    # ⚠️ address 是钱的去处，部署前请逐条核对。
    # 建议优先引导 Polygon / BSC：TRC20 的单笔网络费可能吃掉整笔薄利订单。
    # 默认值 UNSET 让站点在未配置收款地址时**仍能启动**（方便先看演示），
    # 但 /api/health 会把它标成未就绪，且下单接口会拒绝创建订单。
    # 上线前必须 `wrangler secret put POLYGON_ADDRESS`。
    - id: polygon
      enabled: true
      address: "${POLYGON_ADDRESS:-UNSET}"
      confirmations: 30
    # - id: bsc
    #   enabled: true
    #   address: "${BSC_ADDRESS}"
    #   confirmations: 15
    # - id: tron
    #   enabled: true
    #   address: "${TRON_ADDRESS}"
    #   confirmations: 20

  # 同一地址靠唯一小数尾数区分订单，省掉为每单派生地址的密钥管理。
  amountTagging:
    enabled: true
    decimals: 6

fulfillment:
  mode: auto            # auto = 收款确认后自动向上游下单；manual = 只记账
  # 上游余额低于此值告警。余额耗尽会让整站停摆且客户已付款，
  # 阈值至少留够三天流水。
  balanceAlertThreshold: "200"
  haltSalesOnLowBalance: true

alerts:
  # webhookUrl: "${ALERT_WEBHOOK_URL}"
  # telegram:
  #   botToken: "${TG_BOT_TOKEN}"
  #   chatId: "${TG_CHAT_ID}"
